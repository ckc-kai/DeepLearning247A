# @package _global_
module:
  _target_: emg2qwerty.lightning.CyRo2FormersSeq2SeqModule
  in_features: 528          # freq(33) * channels(16)
  mlp_features: [384]

  # --- Electrode Mixer ---
  electrode_mixer_heads: 4
  electrode_mixer_dim: 384
  use_cyrope: true

  # --- Encoder Backbone ---
  backbone_d_model: 768
  backbone_n_layers: 3
  transformer_n_heads: 8
  transformer_dim_feedforward: 2048
  transformer_dropout: 0.15

  # --- Attention Refinement ---
  use_attention_head: true
  attn_n_layers: 2
  attn_n_heads: 8
  attn_dim_feedforward: 1024
  attn_dropout: 0.1

  # --- Decoder ---
  decoder_n_layers: 2
  decoder_n_heads: 8
  decoder_dim_feedforward: 1024
  decoder_dropout: 0.15
  max_decode_length: 50
  label_smoothing: 0.1

  # --- Pretrained Encoder ---
  # Set to checkpoint path to load encoder weights from a CTC model
  pretrained_encoder_ckpt: null
  encoder_lr_scale: 0.1      # encoder LR = base_lr * 0.1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000        # 4 sec windows for 2kHz EMG
  padding: [1800, 200]       # 900ms past context, 100ms future context
  seq2seq_mode: true
