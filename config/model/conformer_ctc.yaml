# @package _global_
# Conformer (Convolution + Transformer) + CTC
# Same front-end and datamodule as TDS Conv; encoder is ConformerEncoder.
module:
  _target_: emg2qwerty.lightning.ConformerCTCModule
  in_features: 528  # (n_fft // 2 + 1) * 16, same as tds_conv_ctc
  mlp_features: [128]
  num_layers: 6
  n_heads: 4
  ffn_expansion: 2
  conv_kernel_size: 15
  dropout: 0.1
  entropy_weight: 0.0
  blank_logit_sub: 3.0
  blank_sub_anneal_epochs: 6
  time_reduction_stride: 2
  time_reduction_kernel_size: 3
  local_attention_window: 32
  intermediate_ctc_weight: 0.3
  intermediate_ctc_layer: 3
  pretrained_frontend: null
  freeze_frontend: false
  # optimizer / lr_scheduler / decoder are injected by train.py

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
